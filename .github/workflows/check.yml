name: Check journal

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify domain-root hosting
        run: npm test
      - name: Verify repository-subdirectory hosting
        run: npm test
        env:
          PATH_PREFIX: /journal-test
          SITE_URL: https://example.github.io
